<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#285C33">
    <title>Lulu Games — jogos para aprender brincando</title>
    <link rel="stylesheet" href="shared/css/tokens.css?v=5">
    <link rel="stylesheet" href="shared/css/base.css?v=5">
    <link rel="stylesheet" href="shared/css/components.css?v=3">
    <link rel="stylesheet" href="shared/css/home.css?v=11">
    <script type="module" src="shared/js/home.js?v=8"></script>
  </head>
  <body class="home">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <header class="home-header">
      <a class="home-brand" href="./index.html" aria-label="Lulu Games, início">
        <img class="home-brand__icon" src="assets/images/ui/brand.svg" alt="">
        <span class="home-brand__text">Lulu<em>Games</em></span>
      </a>
    </header>

    <main class="home-main" id="main-content">
      <section class="home-menu" aria-labelledby="games-title">
        <p class="home-menu__eyebrow">Um lugar para aprender brincando</p>
        <h1 class="home-menu__title" id="games-title">Escolha um jogo</h1>
        <p class="home-menu__text">Você pode ir no seu ritmo.</p>

        <div class="menu-list" id="game-catalog" aria-live="polite"></div>

        <button
          class="menu-settings"
          id="settings-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          <img class="button__icon" src="assets/images/ui/settings.svg" alt="">
          Configurações
        </button>
      </section>
    </main>

    <footer class="home-footer">
      <p>Lulu Games é uma experiência da Atypicaland.</p>
      <p class="home-footer__credit">Foto de Polina no Pexels</p>
    </footer>

    <div class="settings-backdrop" id="settings-backdrop" hidden>
      <section
        class="card home-settings"
        id="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <button class="home-settings__close" id="settings-close" type="button" aria-label="Fechar configurações">×</button>
        <div class="settings-card__intro">
          <div>
            <h2 id="settings-title">Do seu jeito</h2>
            <p>Você pode mudar essas opções quando quiser.</p>
          </div>
        </div>
        <form class="settings-form" id="settings-form">
          <label class="setting-row" for="sound-enabled">
            <span>Som suave</span>
            <input id="sound-enabled" name="soundEnabled" type="checkbox">
          </label>
          <label class="setting-row setting-row--range" for="sound-volume">
            <span>Volume do som</span>
            <input id="sound-volume" name="soundVolume" type="range" min="0" max="0.25" step="0.05">
          </label>
          <label class="setting-row" for="animations-enabled">
            <span>Animações suaves</span>
            <input id="animations-enabled" name="animationsEnabled" type="checkbox">
          </label>
          <label class="setting-row" for="rounds-per-session">
            <span>Rodadas por jogo</span>
            <select id="rounds-per-session" name="roundsPerSession">
              <option value="3">3 rodadas</option>
              <option value="4">4 rodadas</option>
              <option value="5">5 rodadas</option>
            </select>
          </label>
          <p class="settings-form__status" id="settings-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </body>
</html>

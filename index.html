<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FFF8F3">
    <title>Lulu Games — jogos para aprender brincando</title>
    <link rel="stylesheet" href="shared/css/tokens.css">
    <link rel="stylesheet" href="shared/css/base.css">
    <link rel="stylesheet" href="shared/css/components.css">
    <script type="module" src="shared/js/home.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Lulu Games, início">
        <span class="brand__icon" aria-hidden="true">✨</span>
        <span>Lulu Games</span>
      </a>
      <button
        class="button button--secondary settings-toggle"
        id="settings-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="settings-panel"
      >
        <span aria-hidden="true">⚙️</span>
        Configurações
      </button>
    </header>

    <main class="page-shell" id="main-content">
      <section class="welcome-section" aria-labelledby="welcome-title">
        <p class="eyebrow">Um lugar para aprender brincando</p>
        <h1 id="welcome-title">Que bom ter você aqui!</h1>
        <p class="welcome-section__text">Escolha uma brincadeira para começar. Você pode ir no seu ritmo.</p>
      </section>

      <section aria-labelledby="games-title">
        <h2 class="section-title" id="games-title">Escolha um jogo</h2>
        <div class="game-catalog" id="game-catalog" aria-live="polite"></div>
      </section>

      <section class="card settings-card" id="settings-panel" aria-labelledby="settings-title" hidden>
        <div class="settings-card__intro">
          <div>
            <h2 id="settings-title">Do seu jeito</h2>
            <p>Você pode mudar essas opções quando quiser.</p>
          </div>
        </div>
        <form class="settings-form" id="settings-form">
          <label class="setting-row" for="sound-enabled">
            <span>Som suave</span>
            <input id="sound-enabled" name="soundEnabled" type="checkbox">
          </label>
          <label class="setting-row setting-row--range" for="sound-volume">
            <span>Volume do som</span>
            <input id="sound-volume" name="soundVolume" type="range" min="0" max="0.25" step="0.05">
          </label>
          <label class="setting-row" for="animations-enabled">
            <span>Animações suaves</span>
            <input id="animations-enabled" name="animationsEnabled" type="checkbox">
          </label>
          <label class="setting-row" for="rounds-per-session">
            <span>Rodadas por jogo</span>
            <select id="rounds-per-session" name="roundsPerSession">
              <option value="3">3 rodadas</option>
              <option value="4">4 rodadas</option>
              <option value="5">5 rodadas</option>
            </select>
          </label>
          <p class="settings-form__status" id="settings-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <footer class="site-footer">
      <p>Feito com carinho para aprender no seu ritmo. 💜</p>
    </footer>
  </body>
</html>

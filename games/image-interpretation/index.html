<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#B7E88B">
    <title>O que está acontecendo? — Lulu Games</title>
    <link rel="stylesheet" href="../../shared/css/tokens.css?v=6">
    <link rel="stylesheet" href="../../shared/css/base.css?v=5">
    <link rel="stylesheet" href="../../shared/css/components.css?v=6">
    <link rel="stylesheet" href="./game.css?v=10">
    <link rel="stylesheet" href="../../shared/css/scene.css?v=2">
    <script type="module" src="./session.js?v=10"></script>
  </head>
  <body class="app-page">
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <main class="game-page" id="main-content">
      <section class="game-heading" aria-labelledby="game-title">
        <p class="eyebrow">Jogo de imagens e palavras</p>
        <h1 id="game-title">O que está acontecendo?</h1>
      </section>
      <section class="card game-panel">
        <div id="playing-panel" hidden>
          <p class="round-count" id="round-count" role="status" aria-live="polite"></p>
          <img class="scene-image" id="scene-image" width="640" height="480" alt="">
          <h2 class="question"><span aria-hidden="true">🔎</span> Qual frase combina com a imagem?</h2>
          <div class="answer-list" id="answer-list" role="group" aria-label="Opções de resposta"></div>
          <p class="feedback" id="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
          <p class="hint" id="hint" role="status" aria-live="polite" hidden></p>
          <button class="button button--primary" id="next-button" type="button" hidden>Próxima</button>
        </div>
        <div id="complete-panel" hidden>
          <div class="intro-art" aria-hidden="true">👑 ✨ 🖼️</div>
          <h2 tabindex="-1" id="complete-title">Parabéns!</h2>
          <p id="complete-message">Você completou todas as imagens do tema.</p>
          <a class="button button--primary" href="./themes.html">Escolher outro tema</a>
          <a class="button button--secondary" href="../../index.html">Início</a>
        </div>
      </section>
      <footer class="game-footer" id="game-footer">
        <nav class="game-footer__navigation" aria-label="Navegação do jogo">
          <button class="button game-nav-button game-nav-button--back" id="back-button" type="button">
            <span>Temas</span>
          </button>
          <a class="button game-nav-button game-nav-button--home" href="../../index.html" data-home-link>
            <span>Início</span>
          </a>
        </nav>
      </footer>
    </main>
    <dialog class="leave-dialog" id="leave-dialog" aria-labelledby="leave-title">
      <form method="dialog">
        <h2 id="leave-title">Quer sair do tema?</h2>
        <p>Esta partida vai terminar. Você poderá escolher um tema quando quiser.</p>
        <div class="dialog-actions">
          <button class="button button--secondary" value="cancel">Continuar jogando</button>
          <button class="button button--primary" value="leave">Sair</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
